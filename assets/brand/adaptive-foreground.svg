<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Awdah adaptive icon foreground: mark only on transparent, inside the central 66% safe zone.
       Background colour (#161A33) comes from app.json android.adaptiveIcon.backgroundColor. -->
  <g transform="translate(512 512) scale(0.72) translate(-512 -453)">
    <!-- 8-point girih star (two interlaced squares), quiet at low opacity -->
    <g opacity="0.34" fill="none" stroke="#F2DDAA" stroke-width="10" stroke-linejoin="round">
      <rect x="457" y="245" width="110" height="110"/>
      <rect x="457" y="245" width="110" height="110" transform="rotate(45 512 300)"/>
    </g>
    <!-- dawn halo -->
    <path d="M 302 652 A 210 210 0 0 1 722 652" fill="none" stroke="#E3B65A" stroke-width="11" stroke-linecap="round" opacity="0.8"/>
    <!-- rising sun -->
    <path d="M 362 652 A 150 150 0 0 1 662 652 Z" fill="#E3B65A"/>
    <!-- horizon -->
    <rect x="192" y="672" width="640" height="16" rx="8" fill="#E3B65A"/>
  </g>
</svg>
